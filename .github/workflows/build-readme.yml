name: 🔄 Rebuild profile README

# When this workflow runs:
#   - every day at 04:17 UTC (off-peak; arbitrary minute so we don't
#     hit the same slot as everyone else)
#   - on every push to main that changes content/, scripts/ or assets/
#   - on manual dispatch from the Actions tab
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/build-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🛠 Build README
        run: python scripts/build_readme.py

      - name: 💾 Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git add README.md
            git commit -m "chore(readme): refresh dynamic block [skip ci]"
            git push
          else
            echo "README.md unchanged — nothing to commit."
          fi
